<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YugReg | User Information & Validation</title>
  <meta name="description" content="Validate user registration details and profile information.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <img src="favicon.svg" alt="YugReg Logo" class="brand-logo-img">
        <span class="brand-title">YugReg</span>
      </div>
      
      <div class="header-actions">
        <button id="logout-btn" class="logout-btn" title="Sign out and return to registration">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Log Out</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Card Container -->
  <main class="main-wrapper">
    <div class="main-container">
      
      <!-- Shiny Brand Logo Emblem Above Form -->
      <div class="hero-logo-wrapper">
        <div class="shiny-logo-badge">
          <img src="favicon.svg" alt="YugReg Logo" class="shiny-logo-img">
        </div>
      </div>

      <div class="card">
        <!-- ========================================== -->
        <!-- PROFILE & VALIDATION FORM                  -->
        <!-- ========================================== -->
        <section id="page-profile" class="page-view active">
          <div class="card-header">
            <div id="val-badge-success" class="badge-success" style="display: none;">✓ Validated Successfully</div>
            <h1 class="card-title">User Information</h1>
            <p class="card-subtitle">Your registration info is prefilled. Fill the remaining details and click Validate.</p>
          </div>

          <form id="form-validate" novalidate>
            
            <!-- a) Name (Prefilled) -->
            <div class="form-group">
              <div class="label-row">
                <label for="val-name" class="form-label">a) Name</label>
                <span class="prefilled-tag">Prefilled</span>
              </div>
              <input 
                type="text" 
                id="val-name" 
                class="form-input" 
                placeholder="Only characters, no numbers/symbols" 
                required
              >
              <div id="error-val-name" class="error-text"></div>
            </div>

            <!-- b) Password (Prefilled) -->
            <div class="form-group">
              <div class="label-row">
                <label for="val-password" class="form-label">b) Password</label>
                <span class="prefilled-tag">Prefilled</span>
              </div>
              <div class="input-password-wrapper">
                <input 
                  type="password" 
                  id="val-password" 
                  class="form-input" 
                  placeholder="At least one number & one alphabet" 
                  required
                >
                <button type="button" class="pwd-toggle" id="toggle-val-pwd" aria-label="Toggle password visibility">Show</button>
              </div>
              <div id="error-val-password" class="error-text"></div>
            </div>

            <!-- c) Mobile Number -->
            <div class="form-group">
              <label for="val-mobile" class="form-label">c) Mobile Number <span class="req">*</span></label>
              <input 
                type="tel" 
                id="val-mobile" 
                class="form-input" 
                placeholder="10-digit mobile number" 
                inputmode="numeric" 
                maxlength="10"
                required
              >
              <div id="error-val-mobile" class="error-text"></div>
            </div>

            <!-- d) Username -->
            <div class="form-group">
              <label for="val-username" class="form-label">d) Username <span class="req">*</span></label>
              <input 
                type="text" 
                id="val-username" 
                class="form-input" 
                placeholder="Alphanumeric with 1 special character (e.g. user_99)" 
                required
              >
              <div id="error-val-username" class="error-text"></div>
            </div>

            <!-- e) Email (Prefilled) -->
            <div class="form-group">
              <div class="label-row">
                <label for="val-email" class="form-label">e) Email</label>
                <span class="prefilled-tag">Prefilled</span>
              </div>
              <input 
                type="email" 
                id="val-email" 
                class="form-input" 
                placeholder="name@example.com" 
                required
              >
              <div id="error-val-email" class="error-text"></div>
            </div>

            <!-- Validate Button -->
            <button type="button" class="btn btn-primary" id="btn-validate">
              <span>Validate</span>
            </button>

          </form>

          <!-- Validation Success / Failure Message Box -->
          <div id="validation-result" class="result-box" style="display: none;"></div>

        </section>

      </div>
    </div>
  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
