<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YugReg | Create Account</title>
  <meta name="description" content="Mobile-first user registration and account creation.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <img src="favicon.svg" alt="YugReg Logo" class="brand-logo-img">
        <span class="brand-title">YugReg</span>
      </div>
      <div class="header-actions">
        <span class="header-status-tag">Step 1 of 2</span>
      </div>
    </div>
  </header>

  <!-- Main Content Card Container -->
  <main class="main-wrapper">
    <div class="main-container">
      
      <!-- Shiny Brand Logo Emblem Above Form -->
      <div class="hero-logo-wrapper">
        <div class="shiny-logo-badge">
          <img src="favicon.svg" alt="YugReg Logo" class="shiny-logo-img">
        </div>
      </div>

      <div class="card">
        <!-- Auth Mode Switch Tabs -->
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab-btn active" id="tab-btn-register" role="tab" aria-selected="true">Create Account</button>
          <button type="button" class="auth-tab-btn" id="tab-btn-login" role="tab" aria-selected="false">Log In</button>
        </div>

        <!-- ========================================== -->
        <!-- 1. REGISTRATION FORM                       -->
        <!-- ========================================== -->
        <section id="page-register" class="page-view active">
          <div class="card-header">
            <h1 class="card-title">Create an Account</h1>
            <p class="card-subtitle">Please enter your details to register.</p>
          </div>

          <form id="form-register" novalidate>
            
            <!-- Name Field -->
            <div class="form-group">
              <label for="reg-name" class="form-label">Name <span class="req">*</span></label>
              <input 
                type="text" 
                id="reg-name" 
                class="form-input" 
                placeholder="Enter your full name" 
                autocomplete="name" 
                required
              >
              <div id="error-reg-name" class="error-text"></div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
              <label for="reg-email" class="form-label">Email <span class="req">*</span></label>
              <input 
                type="email" 
                id="reg-email" 
                class="form-input" 
                placeholder="Enter your email" 
                autocomplete="email" 
                required
              >
              <div id="error-reg-email" class="error-text"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="reg-password" class="form-label">Password <span class="req">*</span></label>
              <div class="input-password-wrapper">
                <input 
                  type="password" 
                  id="reg-password" 
                  class="form-input" 
                  placeholder="Create a password" 
                  autocomplete="new-password" 
                  required
                >
                <button type="button" class="pwd-toggle" id="toggle-reg-pwd" aria-label="Toggle password visibility">Show</button>
              </div>
              <div id="error-reg-password" class="error-text"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="btn-register">
              <span>Register</span>
            </button>

            <!-- Quick Demo Autofill -->
            <button type="button" class="btn btn-text" id="btn-quick-fill">
              ⚡ Autofill sample information
            </button>

            <!-- Switch to Login link -->
            <p class="auth-switch-text">
              Already have an account? <button type="button" class="auth-switch-link" id="link-to-login">Log in</button>
            </p>

            <!-- Firebase Auth Error Message Box -->
            <div id="reg-auth-error" class="result-box error" style="display: none; margin-top: 14px;"></div>
          </form>
        </section>

        <!-- ========================================== -->
        <!-- 2. LOGIN FORM                              -->
        <!-- ========================================== -->
        <section id="page-login" class="page-view" style="display: none;">
          <div class="card-header">
            <h1 class="card-title">Welcome Back</h1>
            <p class="card-subtitle">Enter your credentials to sign in.</p>
          </div>

          <form id="form-login" novalidate>
            
            <!-- Email Field -->
            <div class="form-group">
              <label for="login-email" class="form-label">Email <span class="req">*</span></label>
              <input 
                type="email" 
                id="login-email" 
                class="form-input" 
                placeholder="Enter your email" 
                autocomplete="email" 
                required
              >
              <div id="error-login-email" class="error-text"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
              <label for="login-password" class="form-label">Password <span class="req">*</span></label>
              <div class="input-password-wrapper">
                <input 
                  type="password" 
                  id="login-password" 
                  class="form-input" 
                  placeholder="Enter your password" 
                  autocomplete="current-password" 
                  required
                >
                <button type="button" class="pwd-toggle" id="toggle-login-pwd" aria-label="Toggle password visibility">Show</button>
              </div>
              <div id="error-login-password" class="error-text"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary" id="btn-login">
              <span>Log In</span>
            </button>

            <!-- Quick Demo Autofill -->
            <button type="button" class="btn btn-text" id="btn-quick-fill-login">
              ⚡ Autofill demo credentials
            </button>

            <!-- Switch to Register link -->
            <p class="auth-switch-text">
              Don't have an account? <button type="button" class="auth-switch-link" id="link-to-register">Create one</button>
            </p>

            <!-- Firebase Auth Error Message Box -->
            <div id="login-auth-error" class="result-box error" style="display: none; margin-top: 14px;"></div>
          </form>
        </section>

      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
