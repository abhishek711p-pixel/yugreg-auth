<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1f1f23" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Chrome / Ivory Metallic Gradients -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <linearGradient id="rightWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="50%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <linearGradient id="centerStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <linearGradient id="accentDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Bevel Lighting & Drop Shadows -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect width="100" height="100" rx="26" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" />

  <!-- Inner Ambient Glow Border -->
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />

  <!-- Stylized Geometric "Y" Monogram (Interlocking Architectural Facets) -->
  <g filter="url(#logoGlow)">
    
    <!-- Left Branch -->
    <path d="M 24 22 
             L 38 22 
             L 50 46 
             L 36 46 
             Z" 
          fill="url(#leftWing)" />

    <!-- Right Branch (Overlapping Depth) -->
    <path d="M 76 22 
             L 62 22 
             L 50 46 
             L 64 46 
             Z" 
          fill="url(#rightWing)" />

    <!-- Vertical Stem -->
    <path d="M 44 46 
             L 56 46 
             L 56 76 
             L 44 76 
             Z" 
          fill="url(#centerStem)" />

    <!-- Central Diamond Nexus (Verification Spark) -->
    <polygon points="50,33 57,41 50,49 43,41" fill="url(#accentDiamond)" />
  </g>
</svg>
